# Fast correctness gate for the verification code behind both papers.
#
# WHAT THIS GUARDS. The repository's value is that `code/` actually supports the
# numbers the drafts cite, and until now nothing enforced that on a change. The
# suite is not a smoke test: it checks a closed-form static-gravity torque, a
# finite-difference Jacobian, mass-matrix symmetry and positive-definiteness, a
# negative case confirming a pure gravity deficit is NOT fixable by retiming,
# and the three structural properties Theorem 4 rests on (the brake recursion's
# shift invariance, its closed-form rest step, and positive invariance of X_f).
# A change to `_brake_profile` that silently invalidated Theorem 4 would fail
# here rather than in a later manual audit.
#
# WHAT IT DELIBERATELY DOES NOT RUN. `run_all.py` (every experiment plus the
# timing benchmark) and the two `wmi_*` modules take minutes and include
# wall-clock timing measurements that are meaningless on shared CI runners --
# Sec. IX-E's own figures have already drifted once with ordinary
# machine variation. Those stay a local/manual step; this workflow is the fast
# gate, not a reproduction of the papers.

name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: code/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r code/requirements.txt

      - name: Record resolved versions
        # The suite pins nothing (see code/requirements.txt for why), so log what
        # actually resolved -- it is the first thing worth knowing if a run that
        # passed yesterday fails today without a code change.
        run: pip list

      - name: Run tests
        working-directory: code
        run: python -m pytest tests/ -q
